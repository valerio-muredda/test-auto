apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-app
  namespace: rightsizing-demo
  labels:
    app: stress-app
    app.kubernetes.io/part-of: rightsizing-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress-app
  template:
    metadata:
      labels:
        app: stress-app
    spec:
      containers:
      - name: stress-app
        image: ghcr.io/nicholasjackson/fake-service:v0.26.2
        ports:
        - containerPort: 9090
        env:
        - name: LISTEN_ADDR
          value: "0.0.0.0:9090"
        - name: NAME
          value: stress-app
        - name: MESSAGE
          value: OK
        readinessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
