apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-app
  namespace: rightsizing-demo
  labels:
    app: stress-app
    app.kubernetes.io/part-of: rightsizing-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stress-app
  template:
    metadata:
      labels:
        app: stress-app
    spec:
      containers:
      - name: stress-app
        image: ghcr.io/nicholasjackson/fake-service:v0.26.2
        ports:
        - containerPort: 9090
        env:
        - name: LISTEN_ADDR
          value: "0.0.0.0:9090"
        - name: NAME
          value: stress-app
        - name: MESSAGE
          value: OK
        # fake-service built-in synthetic load generator: burns CPU and allocates
        # memory FOR THE DURATION OF EACH REQUEST it handles (not a constant
        # background load), so the actual pressure on the pod is proportional to
        # incoming request concurrency - i.e. controlled entirely by whether the
        # k6-traffic-gen-cron CronJob (see demo/toggle-load.sh) is generating
        # traffic or not. Idle (no requests) => no extra load => usage decays
        # toward baseline => VPA*OverProvisioned alerts. Under load => usage
        # climbs toward the container's limits below => VPA*UnderProvisioned
        # alerts (see vpa-aap-implementation.md §17 for sizing rationale).
        - name: LOAD_CPU_CORES
          value: "1"
        - name: LOAD_CPU_PERCENTAGE
          value: "100"
        - name: TIMING_50_PERCENTILE
          value: "250ms"
        - name: TIMING_90_PERCENTILE
          value: "450ms"
        - name: TIMING_99_PERCENTILE
          value: "650ms"
        - name: TIMING_VARIANCE
          value: "30"
        - name: LOAD_MEMORY_PER_REQUEST
          value: "4194304"
        - name: LOAD_MEMORY_VARIANCE
          value: "30"
        readinessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
          # Generous timeout/failureThreshold: under intentional synthetic load
          # (see LOAD_CPU_* / LOAD_MEMORY_* above) response latency legitimately
          # rises into the seconds - probes must tolerate that instead of
          # crash-looping the pod, which would reset VPA's usage history.
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 224m
            memory: 250Mi
          limits:
            cpu: 406m
            # Bumped from 256Mi: under full load LOAD_MEMORY_PER_REQUEST can hold
            # ~100 concurrent in-flight requests x ~4MiB (+/-30% variance) per pod,
            # which needs headroom above the ~375Mi VPA needs to see (1.5x the
            # 250Mi request) to fire VPAMemoryUnderProvisioned without OOMKilling
            # the pod. Requests are left untouched so VPA's over/under-provisioned
            # ratios still compare against the same 250Mi/224m baseline.
            memory: 768Mi
