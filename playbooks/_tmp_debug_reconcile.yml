---
- name: TEMP - Debug reconcile filters
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
    closed_states: ["3", "4", "closed", "canceled", "Closed", "Canceled"]
    pending_approvals: ["requested", "not requested", "Requested", "Not Requested"]
    reconcile_grace_minutes: 5
  tasks:
    - set_fact:
        reconcile_cutoff: "{{ lookup('pipe', 'date -u -d \"-' + (reconcile_grace_minutes | string) + ' minutes\" \"+%Y-%m-%d %H:%M:%S\"') }}"
    - debug: { msg: "cutoff={{ reconcile_cutoff }}" }
    - servicenow.itsm.api_info:
        instance: {host: "{{ snow_host }}", username: "{{ snow_user }}", password: "{{ snow_password }}"}
        resource: change_request
        sysparm_query: "correlation_idSTARTSWITHvpa-rightsizing:"
      register: all_crs
    - debug:
        msg: "{{ item.number }} state={{ item.state }} approval={{ item.approval }} sys_updated_on={{ item.sys_updated_on | default('MISSING') }}"
      loop: "{{ all_crs.record | default(all_crs.records | default([])) }}"
      loop_control: { label: "{{ item.number }}" }
