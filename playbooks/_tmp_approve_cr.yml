---
- name: TEMP - Approve CHG0030010 to drive the full fixed E2E flow
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
  tasks:
    - name: Fetch CHG0030010
      servicenow.itsm.change_request_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        number: CHG0030010
      register: chg

    - debug:
        msg: "state={{ chg.records[0].state }} approval={{ chg.records[0].approval }}"

    - name: Find the pending sysapproval_approver record for this CR
      servicenow.itsm.api_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        resource: sysapproval_approver
        sysparm_query: "document_id={{ chg.records[0].sys_id }}^state=requested"
      register: approvers

    - debug:
        var: approvers.record

    - name: Approve the CAB task(s)
      servicenow.itsm.api:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        resource: sysapproval_approver
        sys_id: "{{ item.sys_id }}"
        action: patch
        data:
          state: approved
      loop: "{{ approvers.record | default([]) }}"
      register: approve_result

    - debug:
        var: approve_result
