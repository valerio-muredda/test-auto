---
- name: TEMP - Inspect current CHG0030008 state
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
  tasks:
    - name: Fetch current CHG0030008
      servicenow.itsm.change_request_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        number: CHG0030008
      register: chg

    - name: Print state/phase/approval
      debug:
        msg: "state={{ chg.records[0].state }} phase={{ chg.records[0].phase }} approval={{ chg.records[0].approval }} assignment_group={{ chg.records[0].assignment_group }}"

    - name: Try closing directly from current state
      servicenow.itsm.change_request:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        number: CHG0030008
        state: closed
        close_code: successful
        close_notes: "[TEST] direct close attempt"
        assignment_group: "VPA Automation"
      register: close_attempt
      ignore_errors: true

    - name: Print close attempt result
      debug:
        var: close_attempt
