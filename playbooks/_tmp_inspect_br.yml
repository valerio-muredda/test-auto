---
- name: TEMP - Patch VPA CR Approval Push business rule to ignore internal re-asserts
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
    br_sys_id: "2a71f01293b6cb107471b0a08bba103e"
    new_script: |
      (function executeRule(current, previous /*null when async*/) {
          if (!current.correlation_id || current.correlation_id.toString().indexOf('vpa-rightsizing:') !== 0) {
              return;
          }
          if (current.approval != 'approved') {
              return;
          }
          if (previous && previous.approval == 'approved') {
              return;
          }
          // Only push for the CR's *original* human CAB approval, which always
          // happens while the CR is still in the "New" state (before the VPA
          // automation's own close-out workflow starts walking it through
          // assess/authorize/scheduled/implement/review/closed). That close-out
          // walk has to transiently reset+re-assert `approval` to pass the
          // Authorize-stage gate on this instance's Change Model; without this
          // guard, that internal re-assert looks like a brand new approval and
          // re-triggers remediation for an already-implemented change.
          var st = current.state.toString().toLowerCase();
          if (st !== '-5' && st !== 'new') {
              return;
          }

          try {
              var request = new sn_ws.RESTMessageV2();
              request.setEndpoint('https://aap2-aap.apps.cluster-jpm9h.dyn.redhatworkshops.io/eda-event-streams/api/eda/v1/external_event_stream/c30da5cf-220a-4a80-b335-3e6a2910e25c/post/');
              request.setHttpMethod('POST');
              request.setRequestHeader('Content-Type', 'application/json');
              request.setRequestHeader('Authorization', 'Bearer 597e1a333c40639380f089e6cbba101739f9ee426bbcd903');

              var body = {
                  number: current.number.toString(),
                  sys_id: current.sys_id.toString(),
                  correlation_id: current.correlation_id.toString(),
                  approval: current.approval.toString(),
                  short_description: current.short_description.toString()
              };
              request.setRequestBody(JSON.stringify(body));

              var response = request.execute();
              gs.info('VPA CR Approval Push: sent for ' + current.number + ' -> HTTP ' + response.getStatusCode());
          } catch (ex) {
              gs.error('VPA CR Approval Push failed for ' + current.number + ': ' + ex.getMessage());
          }
      })(current, previous);
  tasks:
    - name: Patch the business rule script
      servicenow.itsm.api:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        resource: sys_script
        sys_id: "{{ br_sys_id }}"
        action: patch
        data:
          script: "{{ new_script }}"
      register: patch_result

    - debug:
        msg: "Patched. sys_updated_on={{ patch_result.record.sys_updated_on }}"
