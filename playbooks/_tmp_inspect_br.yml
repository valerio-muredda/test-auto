---
- name: TEMP - Inspect VPA CR Approval Push business rule
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
  tasks:
    - name: Find the business rule
      servicenow.itsm.api_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        resource: sys_script
        sysparm_query: "nameLIKEVPA CR Approval"
      register: br

    - debug:
        var: br.record
