---
- name: TEMP - Audit all VPA change requests
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
  tasks:
    - name: Fetch all change requests with a vpa-rightsizing correlation_id
      servicenow.itsm.api_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        resource: change_request
        sysparm_query: "correlation_idSTARTSWITHvpa-rightsizing"
      register: crs

    - name: Print summary
      debug:
        msg: "{{ item.number }} state={{ item.state }} approval={{ item.approval }} close_code={{ item.close_code }} correlation_id={{ item.correlation_id }} created={{ item.sys_created_on }}"
      loop: "{{ crs.record | default(crs.records | default([])) | sort(attribute='number') }}"
      loop_control:
        label: "{{ item.number }}"
