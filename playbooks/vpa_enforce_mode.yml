---
- name: VPA - Enforce Mode (temporary Auto, then revert to Off)
  hosts: localhost
  gather_facts: false
  vars:
    snow_host: "{{ lookup('env', 'SN_HOST') }}"
    snow_user: "{{ lookup('env', 'SN_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SN_PASSWORD') }}"
    correlation_id: "vpa-rightsizing:{{ alert_namespace }}:{{ alert_container | default('') }}:{{ alert_name | default('') }}"

  tasks:
    - name: Patch VPA updateMode to Auto
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: autoscaling.k8s.io/v1
          kind: VerticalPodAutoscaler
          metadata:
            name: "{{ vpa_name | default('stress-app-vpa') }}"
            namespace: "{{ alert_namespace }}"
          spec:
            updatePolicy:
              updateMode: "Auto"

    - name: Wait for pods to be restarted by VPA (up to 5 minutes)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ alert_namespace }}"
        label_selectors:
          - "app={{ app_name | default('stress-app') }}"
      register: pods
      until: >
        pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      retries: 30
      delay: 10

    - name: Revert VPA back to Off mode (after enforcement)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: autoscaling.k8s.io/v1
          kind: VerticalPodAutoscaler
          metadata:
            name: "{{ vpa_name | default('stress-app-vpa') }}"
            namespace: "{{ alert_namespace }}"
          spec:
            updatePolicy:
              updateMode: "Off"

    - name: Find related ServiceNow incident via correlation_id
      servicenow.itsm.incident_info:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        query:
          - correlation_id: "= {{ correlation_id }}"
      register: existing_incidents
      when: alert_container is defined and alert_name is defined

    - name: Update ServiceNow ticket - enforcement applied
      servicenow.itsm.incident:
        instance:
          host: "{{ snow_host }}"
          username: "{{ snow_user }}"
          password: "{{ snow_password }}"
        state: in_progress
        number: "{{ item.number }}"
        work_notes: >
          VPA updateMode temporarily set to Auto. Pods restarted with new resource
          requests. VPA reverted to Off mode. Please verify in cluster and close
          ticket when satisfied.
      loop: "{{ existing_incidents.records | default([]) }}"
      when: existing_incidents is defined and existing_incidents.records is defined
